<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-05 러닝 결과 — 탄천 러너 Wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/common.css">
</head>
<body>

<div class="stage">
  <div class="phone">

    <main class="app-body">
      <div class="section" style="padding-top:28px;gap:20px">

        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span class="caption" id="date">2026.09.10</span>
          <span class="pr-badge" data-when="pr">개인 최고 기록 갱신</span>
        </div>

        <div class="metric-hero" style="padding:4px 0 8px">
          <span class="metric-hero__value" id="distance">7.24</span>
          <span class="metric-hero__unit">km · 총 러닝 거리</span>
        </div>

        <div class="card card--accent" id="rankCard">
          <div class="card__head">
            <span class="card__title">랭킹 반영</span>
            <span class="caption" id="rankNote">탄천 Ranking Zone 내부 거리만 반영돼요</span>
          </div>
          <div class="kv-row">
            <span class="kv-row__key">탄천 인정 거리</span>
            <span class="kv-row__val"><span id="zone">4.51</span> km</span>
          </div>
          <div class="kv-row">
            <span class="kv-row__key">내 순위 (누적 거리 기준)</span>
            <span class="kv-row__val" id="rank">12위</span>
          </div>
        </div>

        <div class="banner banner--positive" data-when="pr">
          <span class="banner__dot"></span>
          <span>최장 거리와 최대 운동 시간을 새로 세웠어요. 자세한 내용은 기록 탭에서 확인할 수 있어요.</span>
        </div>

        <div class="metric-grid" style="padding:0 4px">
          <div class="metric">
            <span class="metric__value" id="time">00:42:10</span>
            <span class="metric__label">러닝 시간</span>
          </div>
          <div class="metric">
            <span class="metric__value" id="pace">5'49"</span>
            <span class="metric__label">페이스 (/km)</span>
          </div>
        </div>

        <p class="caption">이 기록은 Ranking Zone 안팎과 관계없이 자동으로 저장돼요.</p>
      </div>
    </main>

    <div class="cta-bar">
      <div class="cta-bar__row" data-when="default pr">
        <a class="btn" href="06-ranking.html">랭킹 보기</a>
        <a class="btn btn--secondary" href="07-record.html">기록 보기</a>
      </div>
      <div class="cta-bar__row" data-when="zero norank">
        <a class="btn" href="07-record.html">기록 보기</a>
        <a class="btn btn--secondary" href="06-ranking.html?state=empty">랭킹 보기</a>
      </div>
    </div>

  </div>
</div>

<script type="application/json" id="screen-meta">
{
  "id": "SC-05",
  "name": "러닝 결과",
  "purpose": "이번 러닝의 6항목(일자·총 거리·탄천 인정 거리·순위·시간·페이스)을 확인하고 랭킹/기록으로 넘어간다.",
  "trace": {
    "workflow": "S4 결과 확인 · Ranking Zone 판정",
    "feature": "F9 결과 화면 6항목 (+F6 자동 저장, F5 랭킹 반영)",
    "requirement": "R14 결과 6항목 · R8 개인 기록 저장 · R11 Zone 내부만 랭킹 반영 · R12 Zone 외부도 개인 기록 포함",
    "policy": "P4 종료 상태에서만 결과 조회 · P8 종료 시각 순서로 순위 갱신"
  },
  "states": [
    { "id": "default", "label": "Default (랭킹 반영)", "note": "탄천 인정 거리가 있어 순위가 표시된다. 총 거리 → 랭킹 카드 → 시간·페이스 순으로 위계." },
    { "id": "pr", "label": "개인 최고 기록 갱신", "note": "F9 — PR이 갱신되면 이 화면에서 즉시 안내하고, 상세는 기록 탭에서 확인." },
    { "id": "zero", "label": "탄천 인정 거리 0", "note": "F9 예외 — 인정 거리가 0이면 순위 자리에 '랭킹 미반영'. 개인 기록에는 그대로 저장(R12)." },
    { "id": "norank", "label": "랭킹 데이터 없음", "note": "F9 예외 — 가입 초기 등 랭킹 데이터 자체가 없으면 순위 자리에 '아직 랭킹 데이터가 없습니다'." }
  ]
}
</script>
<script>
/* Mock 세션 값 — 기록 탭(SC-07) 목록의 같은 날짜 행과 동일한 값을 쓴다. */
(function () {
  var DATA = {
    default: { date: '2026.09.10', dist: '7.24',  zone: '4.51', time: '00:42:10', pace: "5'49\"", rank: '12위' },
    pr:      { date: '2026.09.05', dist: '12.40', zone: '9.80', time: '01:18:22', pace: "6'19\"", rank: '9위' },
    zero:    { date: '2026.09.08', dist: '5.10',  zone: '0.00', time: '00:31:24', pace: "6'09\"", rank: '랭킹 미반영' },
    norank:  { date: '2026.09.02', dist: '3.20',  zone: '3.20', time: '00:16:06', pace: "5'02\"", rank: '아직 랭킹 데이터가 없습니다' }
  };

  var $ = function (id) { return document.getElementById(id); };

  window.onStateChange = function (state) {
    var d = DATA[state] || DATA.default;
    $('date').textContent = d.date;
    $('distance').textContent = d.dist;
    $('zone').textContent = d.zone;
    $('time').textContent = d.time;
    $('pace').textContent = d.pace;
    $('rank').textContent = d.rank;

    var plain = (state === 'zero' || state === 'norank');
    $('rank').classList.toggle('kv-row__val--muted', plain);
    $('rankCard').classList.toggle('card--accent', !plain);
    $('rankNote').textContent = plain
      ? '이번 러닝은 랭킹에 반영되지 않아요'
      : '탄천 Ranking Zone 내부 거리만 반영돼요';
  };
})();
</script>
<script src="../scripts/common.js"></script>
</body>
</html>
