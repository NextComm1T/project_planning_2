<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-04 러닝 진행 — 탄천 러너 Wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/common.css">
</head>
<body>

<div class="stage">
  <div class="phone">

    <main class="app-body app-body--plain">
      <div class="section" style="padding-top:16px;gap:20px;min-height:100%">

        <div style="display:flex;justify-content:center">
          <span class="status-chip status-chip--ok" data-when="default outside">
            <span class="status-chip__dot"></span>GPS 정상 · 측정 중
          </span>
        </div>

        <div class="banner banner--warn" data-when="weak">
          <span class="banner__dot"></span>
          <span><b>GPS 신호가 약합니다</b><br>신호가 복구될 때까지 직전 측정값이 유지돼요.</span>
        </div>

        <div class="banner banner--info" data-when="outside">
          <span class="banner__dot"></span>
          <span>탄천 Ranking Zone 밖을 달리는 중이에요. 탄천 인정 거리는 늘지 않아요.</span>
        </div>

        <div style="margin:auto 0;display:flex;flex-direction:column;gap:20px">

        <div class="metric-hero" style="padding-top:12px">
          <span class="metric-hero__value" id="distance">3.42</span>
          <span class="metric-hero__unit">km · 총 러닝 거리</span>
        </div>

        <div class="zone-block" data-not="outside">
          <span class="zone-block__label">탄천 인정 누적 거리</span>
          <span class="zone-block__value"><span id="zone">2.10</span> km</span>
        </div>
        <div class="zone-block zone-block--muted" data-when="outside">
          <span class="zone-block__label">탄천 인정 누적 거리 · 유지 중</span>
          <span class="zone-block__value"><span id="zoneOut">2.10</span> km</span>
        </div>

        <div class="metric-grid" style="padding:4px 4px 0">
          <div class="metric metric--center">
            <span class="metric__value" id="time">00:21:12</span>
            <span class="metric__label">러닝 시간</span>
          </div>
          <div class="metric metric--center">
            <span class="metric__value" id="pace">6'12"</span>
            <span class="metric__label">페이스 (/km)</span>
          </div>
        </div>

        <p class="caption" style="text-align:center;margin:4px 0 0">순위는 러닝을 마친 뒤 결과 화면에서 확인할 수 있어요.</p>

        </div>
      </div>
    </main>

    <div class="cta-bar">
      <a class="btn btn--block" href="05-result.html">러닝 종료</a>
    </div>

  </div>
</div>

<script type="application/json" id="screen-meta">
{
  "id": "SC-04",
  "name": "러닝 진행",
  "purpose": "달리는 동안 총 거리·탄천 인정 거리·시간·페이스를 실시간으로 보여주고, 종료 버튼을 상시 노출한다.",
  "trace": {
    "workflow": "S2 러닝 진행 · S3 러닝 종료",
    "feature": "F2 실시간 표시 + 종료 버튼 · F3 GPS 끊김 경고 · F4 끊김→복구 재측정",
    "requirement": "R2 총 거리 · R3 시간 · R4 탄천 인정 거리 · R17 페이스 · R18 종료 버튼 · R5 2초 이상 끊김 경고 · R6 실시간 갱신(순위 비표시)",
    "policy": "P2 끊긴 구간 거리 제외 · P3 2초 이상 끊기면 경고 · P9 시속 25km 초과 구간 인정 거리 제외(조용히 제외)"
  },
  "states": [
    { "id": "default", "label": "Default (실시간)", "note": "R6 — 4개 지표가 1초마다 갱신된다. 순위는 이 화면에 표시하지 않는다." },
    { "id": "weak", "label": "GPS 신호 약함", "note": "F3·P3 — 2초 이상 끊기면 상단 경고 배너. P2에 따라 거리·탄천 인정 거리가 직전 값에 고정되고 갱신이 멈춘다." },
    { "id": "outside", "label": "Zone 밖 주행", "note": "F2 예외 — 총 거리는 계속 늘지만 탄천 인정 거리는 증가하지 않고 유지된다." }
  ]
}
</script>
<script>
/* Mock 실시간 갱신 — 서버·GPS 연결 없이 State 동작만 확인하기 위한 값이다. */
(function () {
  var sec = 1272;        /* 00:21:12 */
  var distM = 3420;      /* 총 러닝 거리 (m) */
  var zoneM = 2100;      /* 탄천 인정 누적 거리 (m) */
  var STEP = 2.8;        /* 1초당 약 2.8m ≈ 6'00"/km */
  var current = 'default';

  var $ = function (id) { return document.getElementById(id); };

  function two(n) { return String(n).padStart(2, '0'); }

  function render() {
    $('distance').textContent = (distM / 1000).toFixed(2);
    var z = (zoneM / 1000).toFixed(2);
    $('zone').textContent = z;
    $('zoneOut').textContent = z;
    $('time').textContent = two(Math.floor(sec / 3600)) + ':' + two(Math.floor(sec / 60) % 60) + ':' + two(sec % 60);
    var paceSec = distM > 0 ? Math.round(sec / (distM / 1000)) : 0;
    $('pace').textContent = Math.floor(paceSec / 60) + "'" + two(paceSec % 60) + '"';
  }

  window.onStateChange = function (state) { current = state; render(); };

  setInterval(function () {
    sec += 1;
    if (current !== 'weak') {                      /* P2: 끊긴 구간은 계산에서 제외 */
      distM += STEP;
      if (current !== 'outside') zoneM += STEP;    /* F2 예외: Zone 밖에서는 인정 거리 유지 */
    }
    render();
  }, 1000);

  render();
})();
</script>
<script src="../scripts/common.js"></script>
</body>
</html>
