<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-02 닉네임 설정 — 탄천 러너 Wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/common.css">
</head>
<body>

<div class="stage">
  <div class="phone">

    <main class="app-body app-body--plain">
      <div class="section" style="padding-top:48px;gap:24px">
        <div style="display:flex;flex-direction:column;gap:8px">
          <span class="caption">가입 2/2</span>
          <h1 class="page-title">닉네임을 정해주세요</h1>
          <p class="page-desc">랭킹과 기록에서 나를 구분하는 이름이에요.</p>
        </div>

        <div class="field">
          <label class="field__label" for="nickname">닉네임 <span style="color:var(--negative)">*</span></label>
          <input class="input" id="nickname" type="text" placeholder="예: 탄천러너_승빈" maxlength="16">
          <p class="inline-msg" data-when="duplicate">
            <span class="inline-msg__dot"></span>
            <span>이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해 주세요.</span>
          </p>
          <p class="inline-msg inline-msg--muted" data-not="duplicate">
            <span class="inline-msg__dot"></span>
            <span>다른 사용자와 중복될 수 없어요. 닉네임은 필수 입력입니다.</span>
          </p>
        </div>
      </div>
    </main>

    <div class="cta-bar">
      <a class="btn btn--block" id="submit" href="03-run-start.html">시작하기</a>
    </div>

  </div>
</div>

<script type="application/json" id="screen-meta">
{
  "id": "SC-02",
  "name": "닉네임 설정",
  "purpose": "가입 시 닉네임을 직접 입력해 저장한다(필수·중복 불가).",
  "trace": {
    "workflow": "S0 회원가입 · 초기 프로필 설정",
    "feature": "F10 닉네임 입력",
    "requirement": "R15 닉네임 직접 설정(필수·중복 불가)",
    "policy": "P5 랭킹에 노출되는 식별자가 이 닉네임"
  },
  "states": [
    { "id": "empty", "label": "미입력 (Disabled)", "note": "F10 예외 — 미입력 시 다음 단계로 진행 불가. 시작하기 버튼 Disabled(회색)." },
    { "id": "filled", "label": "입력 완료", "note": "입력값이 있으면 버튼 활성화. 실제 입력해도 실시간으로 활성/비활성이 바뀐다." },
    { "id": "duplicate", "label": "닉네임 중복", "note": "F10 예외 — 이미 사용 중이면 저장 거부하고 재입력 안내. Input 하단 Inline 오류." }
  ]
}
</script>
<script>
(function () {
  var input = document.getElementById('nickname');
  var submit = document.getElementById('submit');

  function setEnabled(on) {
    if (on) {
      submit.removeAttribute('aria-disabled');
      submit.style.pointerEvents = '';
      submit.style.background = '';
      submit.style.color = '';
    } else {
      submit.setAttribute('aria-disabled', 'true');
      submit.style.pointerEvents = 'none';
      submit.style.background = 'var(--disabled-bg)';
      submit.style.color = 'var(--disabled-fg)';
    }
  }

  window.onStateChange = function (state) {
    if (state === 'empty') input.value = '';
    if (state === 'filled') input.value = '탄천러너_승빈';
    if (state === 'duplicate') input.value = '러너_민수';
    input.classList.toggle('is-error', state === 'duplicate');
    setEnabled(input.value.trim().length > 0);
  };

  input.addEventListener('input', function () {
    setEnabled(input.value.trim().length > 0);
  });
})();
</script>
<script src="../scripts/common.js"></script>
</body>
</html>
