<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SC-03 러닝 시작 — 탄천 러너 Wireframe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../styles/tokens.css">
<link rel="stylesheet" href="../styles/common.css">
</head>
<body>

<div class="stage">
  <div class="phone">

    <main class="app-body app-body--plain">
      <div class="section section--center" style="gap:28px">

        <span class="status-chip" data-when="checking">
          <span class="status-chip__dot"></span>GPS 확인 중
        </span>
        <span class="status-chip status-chip--ok" data-when="ready countdown session">
          <span class="status-chip__dot"></span>GPS 연결됨
        </span>
        <span class="status-chip status-chip--error" data-when="gps-error">
          <span class="status-chip__dot"></span>GPS 사용 불가
        </span>

        <div style="display:flex;flex-direction:column;align-items:center;gap:18px">

          <p class="inline-msg inline-msg--muted" data-when="checking" style="max-width:280px;text-align:left">
            <span class="inline-msg__dot"></span>
            <span>GPS 신호를 확인할 수 없어 러닝을 시작할 수 없습니다</span>
          </p>
          <p class="inline-msg" data-when="gps-error" style="max-width:280px;text-align:left">
            <span class="inline-msg__dot"></span>
            <span>GPS 신호를 확인할 수 없어 러닝을 시작할 수 없습니다</span>
          </p>
          <p class="inline-msg" data-when="session" style="max-width:280px;text-align:left">
            <span class="inline-msg__dot"></span>
            <span>이미 진행 중인 러닝이 있습니다</span>
          </p>

          <button class="btn btn--round" id="startBtn">시작</button>

          <p class="caption" data-when="ready countdown" style="margin:0">탭하면 3초 카운트다운 후 러닝이 시작돼요.</p>
          <p class="caption" data-when="checking" style="margin:0">GPS 확인이 끝나면 버튼이 활성화됩니다.</p>
          <p class="caption" data-when="gps-error session" style="margin:0">지금은 러닝을 시작할 수 없어요.</p>
        </div>

      </div>
    </main>

    <div class="overlay" data-when="countdown">
      <span class="overlay__count" id="count">3</span>
      <span class="overlay__desc">곧 러닝이 시작돼요</span>
    </div>

  </div>
</div>

<script type="application/json" id="screen-meta">
{
  "id": "SC-03",
  "name": "러닝 시작",
  "purpose": "GPS 확인이 끝난 뒤에만 러닝을 시작한다. 시작 버튼 → 3초 카운트다운 → 러닝 진행 화면.",
  "header": "러닝",
  "tab": "run",
  "trace": {
    "workflow": "S1 러닝 시작",
    "feature": "F1 GPS 확인 후 3초 카운트다운·러닝 시작",
    "requirement": "R1 GPS 확인 완료 시에만 버튼 활성화 · R16 3초 카운트다운",
    "policy": "P1 GPS 확인 전 시작 불가 · P7 동시 세션 1개 제한"
  },
  "states": [
    { "id": "checking", "label": "GPS 확인 중", "note": "P1 — 확인이 끝나기 전에는 버튼 Disabled + 안내 문구. 버튼 클릭보다 GPS 확인이 먼저 끝난다." },
    { "id": "ready", "label": "GPS 정상", "note": "R1 — 확인 완료 시에만 시작 버튼 활성화. 누르면 카운트다운 State로 전환된다." },
    { "id": "gps-error", "label": "GPS 사용 불가", "note": "F1 예외 / P1 — 버튼 Disabled 유지 + 오류 안내. 버튼을 누를 수 있다는 것 자체가 GPS 정상이라는 뜻." },
    { "id": "session", "label": "진행 중 세션 존재", "note": "P7 — 한 계정은 진행 중 세션 1개만. 안내 표시하고 새 러닝 시작 차단." },
    { "id": "countdown", "label": "3초 카운트다운", "note": "R16 / F1 — 사용자가 준비할 시간(GPS 확인과 무관). 3→2→1 후 SC-04로 자동 전환." }
  ],
  "issue": "P7 차단 이후 사용자가 할 수 있는 행동(이어하기·강제 종료)이 문서에 정의되어 있지 않아, 안내 문구만 표시하고 시작을 차단하는 것으로 임시 처리했다."
}
</script>
<script>
(function () {
  var btn = document.getElementById('startBtn');
  var count = document.getElementById('count');
  var timer = null;

  btn.addEventListener('click', function () {
    var url = new URL(location.href);
    url.searchParams.set('state', 'countdown');
    location.href = url.toString();
  });

  window.onStateChange = function (state) {
    btn.disabled = (state !== 'ready');
    if (timer) { clearInterval(timer); timer = null; }
    if (state !== 'countdown') return;

    var n = 3;
    count.textContent = n;
    timer = setInterval(function () {
      n -= 1;
      if (n > 0) { count.textContent = n; return; }
      clearInterval(timer);
      timer = null;
      location.href = '04-run-active.html';
    }, 1000);
  };
})();
</script>
<script src="../scripts/common.js"></script>
</body>
</html>
